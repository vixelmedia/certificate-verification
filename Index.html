<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Certificate Verification | Vixel Media</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #171717;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 500px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .verified {
      display: inline-block;
      background: #e8f7ed;
      color: #16803c;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .details {
      text-align: left;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .row {
      margin-bottom: 18px;
    }

    .label {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">VIXEL MEDIA</div>

    <div class="subtitle">
      Certificate Verification
    </div>

    <div class="verified">
      ✓ CERTIFICATE VERIFIED
    </div>

    <div class="details">

      <div class="row">
        <div class="label">Certificate ID</div>
        <div class="value">VXM-FDT-001</div>
      </div>

      <div class="row">
        <div class="label">Name</div>
        <div class="value">Student Name</div>
      </div>

      <div class="row">
        <div class="label">Programme</div>
        <div class="value">
          Professional Flyer Design Training
        </div>
      </div>

      <div class="row">
        <div class="label">Certificate Type</div>
        <div class="value">Certificate of Proficiency</div>
      </div>

      <div class="row">
        <div class="label">Date Issued</div>
        <div class="value">29 August 2026</div>
      </div>

    </div>

    <div class="footer">
      This certificate was issued by Vixel Media.
    </div>

  </div>

</body>
  </html>
